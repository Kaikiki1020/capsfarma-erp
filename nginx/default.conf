server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html/frontend;
    index  index.html index.htm;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ~* ^/(?:\.git|\.env|\.svn|\.hg|\.bzr|backup|backups|vendor|cgi-bin)(?:/|$) {
        return 404;
    }

    location ~* ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.ya?ml|config\.json)$ {
        return 404;
    }

    location ~* \.(?:bak|backup|old|orig|save|swp|sql|dump|tar|tgz|gz|zip|7z)$ {
        return 404;
    }

    location ~* \.wav$ {
        default_type audio/wav;
        try_files $uri =404;
    }

    location = /supabase/config.js {
        default_type application/javascript;
        alias /usr/share/nginx/html/config/database/supabase.browser.js;
    }

    location /supabase/ {
        proxy_pass http://kong:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html/frontend;
    }
}
